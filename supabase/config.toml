# Supabase local/dev config — used by the Supabase CLI for deploys.
# Project ref must match VITE_SUPABASE_URL (https://<project-ref>.supabase.co).

project_id = "lmaiextwuqylbfxxqgwn"

[functions.send-email]
# Allow unauthenticated browser calls from the assessment app.
# The email function itself still validates required payload fields.
verify_jwt = false

[functions.release-clarity-report]
# Requires a signed-in user's JWT; the function also checks the admin role
# and only ever emails the client address stored on the assessment.
verify_jwt = true

[functions.submit-testimonial]
# The function validates its small public form payload and performs the
# protected Clarity-record lookup with the server-side service-role key.
verify_jwt = false
